<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrustVault - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f5f7fb}
.card{border:0;border-radius:16px;box-shadow:0 10px 20px rgba(0,0,0,.05)}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
<a class="navbar-brand fw-bold"><i class="bi bi-shield-lock-fill"></i> TrustVault</a>
<a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>
<div class="container mt-4">
<div class="row g-3">
<div class="col-md-4"><div class="card p-3"><div class="d-flex justify-content-between"><div><h6 class="text-muted">Total Vaults</h6><h2>12</h2></div><div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-key-fill"></i></div></div></div></div>
<div class="col-md-4"><div class="card p-3"><div class="d-flex justify-content-between"><div><h6 class="text-muted">Secure Notes</h6><h2>8</h2></div><div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-file-earmark-lock"></i></div></div></div></div>
<div class="col-md-4"><div class="card p-3"><div class="d-flex justify-content-between"><div><h6 class="text-muted">Security Score</h6><h2>100%</h2></div><div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-shield-check"></i></div></div></div></div>
</div>
<div class="card mt-4 p-4 text-center">
<h4>Welcome Admin! 👋</h4>
<p class="text-muted">Your TrustVault is Running Successfully!</p>
<button class="btn btn-primary px-4 mt-2"><i class="bi bi-plus-lg"></i> Add New Vault</button>
<br><small class="text-success mt-3 d-block fw-bold">Phase 2 Completed ✅</small>
</div>
</div>
</body>
</html>
